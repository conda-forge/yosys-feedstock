{% set name = "yosys" %}
{% set version = "0.68" %}
{% set sha256 = "ad8d2198e1a486e9089cc51a3158ecc764669267879518723fb98acc6fb24787" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  fn: {{ name }}.tar.gz
  url: https://github.com/YosysHQ/{{ name }}/releases/download/v{{ version }}/yosys.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - gcc  # [linux]
    - gxx  # [linux]
    - clang  # [osx]
    - clangxx  # [osx]
    - bison
    - cmake
    - make
    - pkg-config
    - python
  host:
    - flex
    - libffi
    - libzlib
    - readline
    - tk
    - zlib
  run:
    - graphviz
    - libffi
    - libzlib
    - readline
    - tk

test:
  commands:
    - yosys-config --prefix
    - yosys-config --ldflags

about:
  home: https://github.com/YosysHQ/yosys
  license: ISC
  license_family: OTHER
  license_file: COPYING
  summary: Yosys Open SYnthesis Suite
  description: |
    This is a framework for RTL synthesis tools. It currently has extensive Verilog-2005 support and provides a basic set of synthesis algorithms for various application domains.
  dev_url: https://github.com/YosysHQ/yosys

extra:
  recipe-maintainers:
    - whitequark
    - timkpaine
